[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rpgmframe"
version = "0.0.1"
description = "Linux ARM64 runtime conversion tooling for RPG Maker games"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "AZumD" },
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
rpgmframe = "rpgmframe.cli:main"

[tool.setuptools.packages.find]
include = ["rpgmframe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
